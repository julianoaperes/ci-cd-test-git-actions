# Name shown in the repository's GitHub Actions tab.
name: CI Tests - Cypress

# Run this workflow when commits are pushed to main, including merged pull requests.
on:
  push:
    branches: ["main"]

# Jobs group the work that GitHub Actions runs.
jobs:
  # Job identifier; despite its name, this job installs dependencies and runs tests.
  build:
    # Use a fresh GitHub-hosted Ubuntu virtual machine for each run.
    runs-on: ubuntu-latest

    # Steps run in order, so the project and its dependencies are ready before tests.
    steps:
      # Download the repository onto the runner so later steps can access its files.
      - uses: actions/checkout@v5
      # Configure the Node.js runtime needed to run npm and Cypress.
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          # Use Node.js 18 to keep the major runtime version consistent across runs.
          node-version: 18
          # Cache npm's downloaded packages to speed up later runs; installation is still needed.
          cache: "npm"
      # Install the dependencies declared in package.json, including Cypress.
      - name: Install dependencies
        run: npm install
      # Run the project's Cypress tests without an interactive browser window.
      # npx finds the installed Cypress CLI; a failing test makes this step and job fail.
      - name: Execute tests
        run: npm test

      - name: Generate allure reports
        run: npm run allure:generate
      - name: Publication on Gh pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
        permissions:
          contents: write
